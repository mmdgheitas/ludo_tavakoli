name: CI
on:
  pull_request:
  push:
    branches: [main, 'arena/**']

jobs:
  node:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm run db:generate
      - run: npm run lint
      - run: npm test
      - run: npm run build

  flutter:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: apps/ludo_app } }
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with: { flutter-version: '3.29.3', channel: stable, cache: true }
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
