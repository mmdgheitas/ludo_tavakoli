name: manche-irani
services:
  postgres:
    image: postgres:16-alpine
    ports:
      - '5432:5432'
    restart: unless-stopped
    environment:
      POSTGRES_DB: manche
      POSTGRES_USER: manche
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-manche_dev}
    volumes: [postgres_data:/var/lib/postgresql/data]
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U manche -d manche"]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [private]

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    restart: unless-stopped
    command: [redis-server, --appendonly, "yes", --requirepass, "${REDIS_PASSWORD:-redis_dev}"]
    volumes: [redis_data:/data]
    healthcheck:  
      test: [CMD, redis-cli, -a, "${REDIS_PASSWORD:-redis_dev}", ping]
      interval: 5s
      timeout: 3s
      retries: 15
    networks: [private]

